<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet Hunt Wiki</title>
<!-- PH_DATA / PH_ME come from the two files the in-game script writes next to this page -->
<script src="data.mjs"></script>
<script src="me.mjs"></script>
<style>
:root{
  --bg:#f5f6f8;--panel:#ffffff;--panel2:#eef0f4;--text:#1b1e24;--muted:#646b78;--line:#dde1e8;
  --accent:#3a6df0;--accent2:#e8eefc;--good:#1f9d55;--bad:#d64545;--warn:#b7791f;
  --r-Common:#8a909c;--r-Uncommon:#2f9e4f;--r-Rare:#2f7de1;--r-Epic:#8b4fe0;--r-Legendary:#d98b00;
  --r-Mythic:#e0336f;--r-Transcendent:#119e8a;--r-Cosmic:#6a4fe0;--r-Secret:#b08a1e;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141a;--panel:#1a1d25;--panel2:#232733;--text:#e6e8ee;--muted:#9aa1ae;--line:#2c313d;
  --accent:#7aa2ff;--accent2:#23304d;--good:#4cc17d;--bad:#ff7070;--warn:#e7b54a;
  --r-Common:#b0b6c4;--r-Uncommon:#60ce76;--r-Rare:#489aff;--r-Epic:#b262ff;--r-Legendary:#ffac2c;
  --r-Mythic:#ff4880;--r-Transcendent:#78fae1;--r-Cosmic:#a58cff;--r-Secret:#fadc78;}}
:root[data-theme="dark"]{
  --bg:#12141a;--panel:#1a1d25;--panel2:#232733;--text:#e6e8ee;--muted:#9aa1ae;--line:#2c313d;
  --accent:#7aa2ff;--accent2:#23304d;--good:#4cc17d;--bad:#ff7070;--warn:#e7b54a;
  --r-Common:#b0b6c4;--r-Uncommon:#60ce76;--r-Rare:#489aff;--r-Epic:#b262ff;--r-Legendary:#ffac2c;
  --r-Mythic:#ff4880;--r-Transcendent:#78fae1;--r-Cosmic:#a58cff;--r-Secret:#fadc78;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Noto Sans Thai","Leelawadee UI","Segoe UI",system-ui,sans-serif}
a{color:var(--accent);text-decoration:none;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;white-space:nowrap}
header .ver{color:var(--muted);font-size:12px}
header input{flex:1;min-width:180px;max-width:420px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text)}
header button{padding:6px 10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;cursor:pointer}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
nav a{padding:5px 11px;border-radius:999px;color:var(--text);font-size:13px}
nav a.on{background:var(--accent);color:#fff}
main{padding:16px;max-width:1500px;margin:0 auto}
h2{font-size:19px;margin:6px 0 12px}
h3{font-size:15px;margin:16px 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:13px}
.kv b{font-weight:500;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--panel2);font-size:12px;margin:1px 2px 1px 0;white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--panel2);font-weight:600;cursor:pointer;white-space:nowrap;user-select:none}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.det td{background:var(--panel2)}
tbody tr:hover td{background:var(--accent2)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px;align-items:center}
.filters select,.filters input{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text)}
.rar{font-weight:600}
.note{border-left:3px solid var(--accent);padding:8px 12px;background:var(--accent2);border-radius:6px;margin:8px 0;font-size:13px}
.warnbox{border-left:3px solid var(--warn);padding:8px 12px;background:color-mix(in srgb,var(--warn) 12%,transparent);border-radius:6px;margin:8px 0;font-size:13px}
code,.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.formula{font-family:ui-monospace,Consolas,monospace;background:var(--panel2);padding:8px 10px;border-radius:8px;white-space:pre-wrap;font-size:12.5px}
.calc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.calc label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.calc input{padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);color:var(--text)}
.empty{padding:40px;text-align:center;color:var(--muted)}
@media (max-width:640px){main{padding:10px}header{padding:8px 10px}nav{padding:6px 10px}}
</style>
</head>
<body>
<header>
  <h1>🐾 Pet Hunt Wiki</h1>
  <span class="ver" id="ver"></span>
  <input id="q" placeholder="ค้นหา มอน / อุปกรณ์ / การ์ด / ไอเทม ..." autocomplete="off">
  <button id="theme" title="สลับธีม">◐</button>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<script>
"use strict";
const D = window.PH_DATA, ME = window.PH_ME;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {get(k, d){try{const v = localStorage.getItem("phw_" + k); return v == null ? d : JSON.parse(v)}catch(e){return d}},
  set(k, v){try{localStorage.setItem("phw_" + k, JSON.stringify(v))}catch(e){}}};

if (!D) {
  document.getElementById("main").innerHTML = `<div class="empty">ยังไม่มีข้อมูลเกม<br><br>เปิดสคริป Pet Hunt ในเกมก่อน ระบบจะสร้างไฟล์ <code>data.mjs</code> ไว้ข้างหน้านี้ให้เอง แล้วกดรีเฟรช</div>`;
  throw new Error("no data");
}

// ------------------------------------------------------------ lookups
const EQ = D.equipment || {}, MON = D.monsters || {}, CARDS = D.cards || {}, ITEMS = (D.items || {}).defs || {};
const PETS = (D.pets || {}).defs || {}, CL = D.classes || {}, ST = D.stats || {}, FO = D.formulas || {};
const DG = D.dungeons || {}, WB = D.worldBoss || {};
const fields = (D.zones && D.zones.fields) || [];
const fieldName = id => (fields.find(f => f.id === id) || {}).name || (D.fusion && D.fusion.biomes && D.fusion.biomes[id]) || id || "-";
const fieldOrder = id => { const i = fields.findIndex(f => f.id === id); return i < 0 ? 99 : i; };
const RAR = CARDS.rarityOrder || ["Common","Uncommon","Rare","Epic","Legendary","Mythic","Transcendent","Cosmic","Secret"];
const rarSpan = r => r ? `<span class="rar" style="color:var(--r-${esc(r)})">${esc(r)}</span>` : "-";
const TIER = ["Tier I","Tier II","Tier III","Tier IV","Tier V"];
const tierOf = d => d.dungeon ? "DG" : TIER[Math.max(0, Math.min(4, d.lines || 0))];
const typeName = t => (EQ.typeNames || {})[t] || t;
const optByKey = {}; (EQ.options || []).forEach(o => optByKey[o.key] = o);

// stat keys shown as percentages
const PCT = new Set(["crit","aspd","cdr","lifesteal","critDmg","armorPen","dmgReduce","thorns","summonAspd","potionPct","spRegen"]);
const isPct = k => PCT.has(k) || /Pct$/.test(k);
const statName = k => (EQ.lineNames || {})[k] || ({maxSp:"Max SP",maxSpPct:"Max SP",potionPct:"Potion Heal",thorns:"Thorns",spRegen:"SP Regen",
  summonAspd:"Pack Attack Speed",summonTime:"Pack Duration",hp:"HP",sp:"SP"})[k] || k;
const num = (x, d = 0) => (x == null || isNaN(x)) ? "-" : Number(x).toLocaleString("en-US", {maximumFractionDigits: d, minimumFractionDigits: 0});
const fmtStat = (k, v) => {
  if (typeof v !== "number") return esc(String(v));
  if (isPct(k)) return (k === "cdr" ? "-" : "+") + num(Math.abs(v) * 100, 2) + "%";
  return (v >= 0 ? "+" : "") + num(v, 2);
};
const bonusList = b => !b ? "" : Object.entries(b).map(([k, v]) => {
  const eff = CARDS.effects && CARDS.effects[k];
  if (eff && v === 1) return `<span class="pill warn" title="${esc(eff.text)}">${esc((eff.text || k).split(":")[0])}</span>`;
  return `<span class="pill">${esc(statName(k))} ${fmtStat(k, v)}</span>`;
}).join("");
const chanceTxt = c => {
  if (c == null) return "-";
  if (c >= 1) return "100%";
  const p = c * 100;
  const s = p >= 1 ? num(p, 2) : p >= 0.01 ? num(p, 3) : num(p, 4);
  return `${s}% <span class="muted small">(1/${num(Math.round(1 / c))})</span>`;
};
const nameOf = id => (EQ.defs && EQ.defs[id] && EQ.defs[id].name) || (ITEMS[id] && ITEMS[id].name) || (MON.defs && MON.defs[id] && MON.defs[id].name) || id;
const dropName = d => d.gear ? `<a data-go="gear:${esc(d.gear)}">${esc(nameOf(d.gear))}</a>` : `<a data-go="item:${esc(d.item)}">${esc(nameOf(d.item))}</a>`;
const dropRow = d => `${dropName(d)}${d.count && d.count > 1 ? " ×" + d.count : ""} — ${chanceTxt(d.chance)}`;
const ago = t => { if (!t) return "-"; const s = Math.max(0, Date.now() / 1000 - t); return s < 90 ? Math.round(s) + " วินาทีที่แล้ว" : s < 5400 ? Math.round(s / 60) + " นาทีที่แล้ว" : s < 172800 ? Math.round(s / 3600) + " ชั่วโมงที่แล้ว" : Math.round(s / 86400) + " วันที่แล้ว"; };
const dur = s => s < 90 ? num(s, 1) + " วิ" : s < 5400 ? num(s / 60, 1) + " นาที" : num(s / 3600, 1) + " ชม.";
const when = t => t ? new Date(t * 1000).toLocaleString("th-TH") : "-";

// card chance, same as Cards.chanceFor + liveChance
const seasonMult = CARDS.seasonMultiplier || 1;
function cardChance(cardId, role) {
  const dc = CARDS.dropChance || {}, cd = (CARDS.defs || {})[cardId];
  let c = dc[role] || 0;
  if (role === "normal" && cd) c = (CARDS.rarityDropChance || {})[cd.rarity] ?? c;
  return Math.min(1, c * seasonMult);
}

// reverse index: where each gear / item drops
const sources = {};
const addSrc = (id, s) => { if (!id) return; (sources[id] = sources[id] || []).push(s); };
Object.values(MON.defs || {}).forEach(m => (m.drops || []).forEach(d => addSrc(d.gear || d.item, {text: `<a data-go="mon:${esc(m.id)}">${esc(m.name)}</a> <span class="muted small">Lv${m.level} ${roleTh(m.role)}</span>`, chance: d.chance, count: d.count})));
(WB.drops || []).forEach(d => addSrc(d.gear || d.item, {text: "World Boss (ทุกตัว)", chance: d.chance, count: d.count}));
Object.values(DG.byId || {}).forEach(dg => Object.entries(dg.difficultyById || {}).forEach(([diff, dd]) => Object.entries(dd.loot || {}).forEach(([kind, list]) => (list || []).forEach(d =>
  addSrc(d.gear || d.item, {text: `<a data-go="dungeon">${esc(dg.name)}</a> <span class="muted small">${esc(diff)} · ${kindTh(kind)}</span>`, chance: d.chance, count: d.count})))));
(EQ.shop || []).forEach(id => addSrc(id, {text: "ร้านค้าในเมือง" + (EQ.defs[id] && EQ.defs[id].buyPrice ? ` <span class="muted small">${num(EQ.defs[id].buyPrice)} ทอง</span>` : ""), chance: null}));
function roleTh(r){return ({normal:"ธรรมดา",elite:"Elite",boss:"บอส"})[r] || r || "";}
function kindTh(k){return ({mob:"มอน",elite:"Elite",mini:"มินิบอส",boss:"บอส",chest:"หีบ"})[k] || k;}

// ------------------------------------------------------------- my stats
const A = (ME && ME.attrs) || {};
const myBonus = (typeof A.Bonus === "object" && A.Bonus) || {};
const myClass = A.Class, myLv = A.Level || 1;
const lineWorks = (key, cls) => { const o = optByKey[key]; if (!o) return true; return !o.classes || o.classes.includes(cls); };
const calcDefault = () => ({
  atk: A.Atk || 1000, lv: myLv, crit: Math.min(1, A.Crit ?? 0.05), critDmg: myBonus.critDmg || 0, armorPen: myBonus.armorPen || 0,
  dmgPct: myBonus.dmgPct || 0, bossDmgPct: myBonus.bossDmgPct || 0, interval: A.AttackInterval || 1, goldPct: (myBonus.goldPct || 0) + ((A.RewardBonus || {}).goldPct || 0),
  expPct: (myBonus.expPct || 0) + ((A.RewardBonus || {}).expPct || 0), travel: 1.5});
const round4 = o => { for (const k in o) if (typeof o[k] === "number") o[k] = Math.round(o[k] * 1e4) / 1e4; return o; };
let calc = round4(Object.assign(calcDefault(), store.get("calc", {})));
if (ME && store.get("calcAt", 0) !== ME.at) { calc = round4(calcDefault()); store.set("calcAt", ME.at); store.set("calc", calc); }

// expected hit on a monster: Formulas.damage averaged over the 0.9-1.1 roll and crit chance
function hitOn(m, c = calc) {
  const gapC = FO.levelGap || {step: .05, min: .5, max: 1.5};
  const gap = Math.min(gapC.max, Math.max(gapC.min, 1 - ((m.level || 1) - c.lv) * gapC.step));
  const mult = 1 + (c.dmgPct || 0) + (m.isBoss || m.role === "boss" ? (c.bossDmgPct || 0) : 0);
  const base = c.atk * mult * gap;
  const def = (m.def || 0) * (1 - Math.min(c.armorPen || 0, FO.armorPenCap ?? .5));
  const k = FO.tierDefK || 6000, ratio = m.tier != null;
  const after = v => Math.max(1, ratio ? Math.floor(v * k / (k + def)) : Math.floor(v - def * .5));
  const crit = Math.min(1, Math.max(0, c.crit || 0)), cm = (FO.critMultiplier || 1.5) + (c.critDmg || 0);
  return (1 - crit) * after(base) + crit * after(base * cm);
}

// ------------------------------------------------------------- tables
// rows: array of objects; cols: [{h, k (sort key fn or prop), v (html fn), num}]; detail(row) optional
function table(id, rows, cols, detail, initSort) {
  const st = store.get("sort_" + id, initSort || null);
  const sorted = rows.slice();
  if (st) {
    const c = cols[st.i]; const kf = c && (typeof c.k === "function" ? c.k : r => r[c.k]);
    if (kf) sorted.sort((a, b) => { const x = kf(a), y = kf(b); return (x > y ? 1 : x < y ? -1 : 0) * st.d; });
  }
  let h = `<div class="tw"><table data-tid="${id}"><thead><tr>`;
  cols.forEach((c, i) => h += `<th class="${c.num ? "num" : ""}" data-i="${i}">${c.h}${st && st.i === i ? (st.d > 0 ? " ▲" : " ▼") : ""}</th>`);
  h += `</tr></thead><tbody>`;
  if (!sorted.length) h += `<tr><td colspan="${cols.length}" class="muted">ไม่มีข้อมูลที่ตรงเงื่อนไข</td></tr>`;
  sorted.forEach((r, ri) => {
    h += `<tr${detail ? ` data-ri="${ri}" style="cursor:pointer"` : ""}>` + cols.map(c => `<td class="${c.num ? "num" : ""}">${c.v ? c.v(r) : esc(r[c.k])}</td>`).join("") + `</tr>`;
  });
  h += `</tbody></table></div>`;
  tables[id] = {rows: sorted, cols, detail};
  return h;
}
const tables = {};
document.addEventListener("click", ev => {
  const th = ev.target.closest("th[data-i]");
  if (th) {
    const id = th.closest("table").dataset.tid, i = +th.dataset.i;
    const cur = store.get("sort_" + id, null);
    store.set("sort_" + id, {i, d: cur && cur.i === i ? -cur.d : (tables[id].cols[i].num ? -1 : 1)});
    render(); return;
  }
  const go = ev.target.closest("[data-go]");
  if (go) { ev.preventDefault(); openRef(go.dataset.go); return; }
  const tr = ev.target.closest("tr[data-ri]");
  if (tr && !ev.target.closest("a")) {
    const t = tables[tr.closest("table").dataset.tid];
    const next = tr.nextElementSibling;
    if (next && next.classList.contains("det")) { next.remove(); return; }
    const row = t.rows[+tr.dataset.ri];
    tr.insertAdjacentHTML("afterend", `<tr class="det"><td colspan="${t.cols.length}">${t.detail(row)}</td></tr>`);
  }
});
function openRef(ref) {
  const [kind, id] = ref.split(":");
  const map = {mon: "monsters", gear: "gear", item: "items", card: "cards", dungeon: "dungeons", boss: "bosses"};
  state.page = map[kind] || kind; state.focus = id || null; location.hash = state.page;
  render();
  if (id) setTimeout(() => { const el = document.querySelector(`[data-id="${CSS.escape(id)}"]`); if (el) { el.scrollIntoView({block: "center"}); el.click(); } }, 30);
}

// --------------------------------------------------------------- pages
const PAGES = [
  ["home", "ภาพรวม"], ["me", "ตัวฉัน"], ["classes", "อาชีพ"], ["options", "ออฟชั่นอุปกรณ์"], ["gear", "อุปกรณ์"],
  ["monsters", "มอนสเตอร์ & คำนวณดาเมจ"], ["bosses", "บอส"], ["cards", "การ์ด"], ["items", "ไอเทม"],
  ["dungeons", "ดันเจี้ยน"], ["formulas", "สูตร & ตีบวก"],
];
const state = {page: (location.hash || "#home").slice(1), q: "", focus: null};
window.addEventListener("hashchange", () => { state.page = location.hash.slice(1) || "home"; render(); });

const P = {};
P.home = () => {
  const mons = Object.values(MON.defs || {});
  const c = (f) => mons.filter(f).length;
  return `<h2>ภาพรวม</h2>
  <div class="grid">
    <div class="card"><h3 style="margin-top:0">ข้อมูลเกม</h3><div class="kv">
      <b>เวอร์ชันเกม</b><span>${D.meta.placeVersion}</span>
      <b>ดึงข้อมูลเมื่อ</b><span>${when(D.meta.dumpedAt)} <span class="muted small">(${ago(D.meta.dumpedAt)})</span></span>
      <b>มอนสเตอร์</b><span>${c(m => m.role === "normal")} ธรรมดา · ${c(m => m.role === "elite")} Elite · ${c(m => m.role === "boss")} บอส</span>
      <b>อุปกรณ์</b><span>${Object.keys(EQ.defs || {}).length} ชิ้น</span>
      <b>การ์ด</b><span>${Object.keys(CARDS.defs || {}).length + Object.keys(DG.cards || {}).length} ใบ</span>
      <b>ไอเทม</b><span>${Object.keys(ITEMS).length} ชนิด</span>
      <b>ฟิลด์</b><span>${fields.length}</span>
    </div></div>
    <div class="card"><h3 style="margin-top:0">ตัวละคร</h3>${ME ? `<div class="kv">
      <b>ชื่อ</b><span>${esc(ME.display)} <span class="muted">@${esc(ME.name)}</span></span>
      <b>อาชีพ</b><span>${esc(myClass)} Lv ${myLv}</span>
      <b>Power</b><span>${num(A.Power)}</span>
      <b>ATK / DEF / HP</b><span>${num(A.Atk)} / ${num(A.Def)} / ${num(A.MaxHp)}</span>
      <b>อัปเดตเมื่อ</b><span>${ago(ME.at)}</span></div>` : `<span class="muted">ยังไม่มีข้อมูลตัวละคร (me.mjs)</span>`}</div>
    <div class="card"><h3 style="margin-top:0">อัปเดตยังไง</h3>
      <div class="small">เปิดสคริป Pet Hunt ในเกม → สคริปเช็กเวอร์ชันเกม (PlaceVersion)<br>
      • เกมอัปเดต → ดึงข้อมูลใหม่ทั้งหมดจาก config ของเกมเอง เขียนทับ <code>data.mjs</code><br>
      • ข้อมูลตัวละคร (<code>me.mjs</code>) อัปเดตทุก 1 นาทีขณะเล่น<br>
      กด F5 ที่หน้านี้เพื่อดูข้อมูลล่าสุด</div></div>
  </div>
  <div class="card"><h3 style="margin-top:0">ฟิลด์</h3>${table("fields", fields.map((f, i) => ({...f, i})), [
    {h: "#", k: "i", num: true, v: r => r.i + 1},
    {h: "ฟิลด์", k: "name"},
    {h: "เลเวลมอน", k: r => (r.levels || [0])[0], v: r => r.levels ? r.levels.join(" - ") : "-"},

P.me = () => {
  if (!ME) return `<div class="empty">ยังไม่มีข้อมูลตัวละคร — เปิดสคริปในเกมรอ 1 นาทีแล้วรีเฟรช</div>`;
  const statRows = (ST.list || []).map(s => `<span class="pill">${s.toUpperCase()} ${A["Stat_" + s] ?? 0}</span>`).join("");
  const classLv = (CL.list || []).map(c => `<span class="pill ${c === myClass ? "good" : ""}">${esc(c)} ${A["ClassLv_" + c] ?? 1}</span>`).join("");
  const capped = Array.isArray(A.BonusCapped) ? A.BonusCapped : Object.keys(A.BonusCapped || {});
  const keys = [...new Set([...Object.keys(myBonus), ...Object.keys(A.BonusRolled || {}), ...Object.keys(A.BonusBoss || {})])]
    .filter(k => typeof myBonus[k] === "number" || typeof (A.BonusRolled || {})[k] === "number").sort();
  const capOf = k => (EQ.rollCaps || {})[k];
  const bonusRows = keys.filter(k => !(CARDS.effects && CARDS.effects[k])).map(k => ({k, total: myBonus[k] || 0, rolled: (A.BonusRolled || {})[k] || 0, boss: (A.BonusBoss || {})[k] || 0, cap: capOf(k)}))
    .filter(r => r.total || r.rolled || r.boss);
  const eq = ME.equipped || {};
  const eqRows = Object.entries(eq).map(([slot, p]) => {
    const def = EQ.defs[p.id] || {};
    const lines = [p.main ? {...p.main, isMain: true} : null, ...(p.options || [])].filter(Boolean).map(l => {
      const works = l.isMain || lineWorks(l.key, myClass), legacy = optByKey[l.key] && optByKey[l.key].legacy;
      return `<span class="pill ${works ? "" : "bad"}" title="${works ? "" : "ไม่มีผลกับ " + esc(myClass)}">${l.isMain ? "<b>main</b> " : ""}${esc(statName(l.key))} ${fmtStat(l.key, l.value)}${legacy ? " ·เก่า" : ""}${works ? "" : " ✗"}</span>`;
    }).join("");
    return `<tr><td>${esc(slot)}</td><td><a data-go="gear:${esc(p.id)}">${esc(def.name || p.id)}</a>${p.refine ? ` <b>+${p.refine}</b>` : ""} <span class="muted small">Lv${def.level ?? "?"} ${tierOf(def)}</span></td><td>${bonusList(def.bonus)}</td><td>${lines}</td></tr>`;
  }).join("");
  return `<h2>ตัวฉัน — ${esc(ME.display)} <span class="muted small">อัปเดต ${ago(ME.at)}</span></h2>
  <div class="grid">
    <div class="card"><h3 style="margin-top:0">สเตตัสสุดท้าย (จากเกม)</h3><div class="kv">
      <b>อาชีพ</b><span>${esc(myClass)} Lv ${myLv} · Power ${num(A.Power)}</span>
      <b>ATK</b><span>${num(A.Atk)}</span><b>DEF</b><span>${num(A.Def)}</span>
      <b>Max HP / SP</b><span>${num(A.MaxHp)} / ${num(A.MaxSp)}</span>
      <b>Crit Rate</b><span>${num((A.Crit || 0) * 100, 2)}% ${A.Crit >= 1 ? '<span class="pill warn">ตัน 100%</span>' : ""}</span>
      <b>Cooldown</b><span>-${num((A.Cdr || 0) * 100, 1)}%</span>
      <b>ตีทุก</b><span>${num(A.AttackInterval, 3)} วินาที (${num(1 / (A.AttackInterval || 1), 2)} ครั้ง/วิ)</span>
      <b>Skill Power</b><span>+${num(((A.SkillPct || 1) - 1) * 100, 1)}%</span>

    <div class="card"><h3 style="margin-top:0">แต้มสเตตัส & เลเวลอาชีพ</h3>${statRows}<br><br>${classLv}
      <div class="small muted" style="margin-top:8px">สเตตัสหลักของ ${esc(myClass)}: <b>${esc(((CL.defs || {})[myClass] || {}).atkStat || "-").toUpperCase()}</b> (1 แต้ม = +${ST.scale || 10} ATK)</div></div>
  </div>
  <div class="card"><h3 style="margin-top:0">อุปกรณ์ที่ใส่</h3>
    <div class="note">บรรทัดสีแดง ✗ = ออฟชั่นของอาชีพอื่น ใส่แล้วไม่ได้ผลกับ ${esc(myClass)} · "เก่า" = ออฟชั่นที่เกมเลิกสุ่มแล้ว แต่ของที่มีอยู่ยังได้ค่าเต็ม</div>
    <div class="tw"><table><thead><tr><th>ช่อง</th><th>ชิ้น</th><th>ค่าพื้นฐาน</th><th>บรรทัดที่โรล</th></tr></thead><tbody>${eqRows || '<tr><td colspan="4" class="muted">-</td></tr>'}</tbody></table></div></div>

      {h: "จากการ์ดบอส", k: "boss", num: true, v: r => r.boss ? fmtStat(r.k, r.boss) : "-"},

P.classes = () => {
  const lv = store.get("clsLv", myLv || 99);

    const v = L - 1, late = d.latePerLevel || {}, x = Math.max(0, L - (CL.lateFrom || 52)), sc = ST.scale || 10;
    const f = k => Math.floor(d.base[k] + d.perLevel[k] * v + (late[k] || 0) * x);
    return {hp: f("hp") * sc, sp: Math.floor(d.base.sp + d.perLevel.sp * v + (late.sp || 0) * x), atk: f("atk") * sc, def: f("def") * sc, crit: d.base.crit};
  };
  const skillRow = s => `<tr><td><b>${esc(s.name)}</b>${s.tag ? ` <span class="pill">${esc(s.tag)}</span>` : ""}</td><td>${esc(s.kind || (s.perLevel ? "passive" : ""))}</td>

    <td class="small">${[s.radius ? "รัศมี " + s.radius : "", s.range ? "ระยะ " + s.range : "", s.duration ? "นาน " + s.duration + "s" : "", s.buff ? "บัฟ " + bonusList(s.buff) : "", s.buffPerLevel ? "ต่อเลเวลสกิล " + bonusList(s.buffPerLevel) : "", s.perLevel ? "ต่อเลเวล " + bonusList(s.perLevel) : "", s.defDown ? "ลด DEF " + num(s.defDown * 100) + "%" : ""].filter(Boolean).join(" · ")}</td></tr>`;

  return `<h2>อาชีพ</h2>
  <div class="filters"><label>ดูค่าที่เลเวล <input id="clsLv" type="number" min="1" max="99" value="${lv}" style="width:70px"></label>
  <span class="muted small">ATK/DEF/HP ที่โชว์ = ค่าฐานของอาชีพ (ยังไม่รวมแต้ม ของ การ์ด) คูณ ×${ST.scale || 10} แบบที่เกมโชว์</span></div>
  ${list.map(id => { const d = (CL.defs || {})[id]; if (!d) return ""; const s = statsAt(d, lv); const j = j2[id];
    return `<div class="card" data-id="${esc(id)}"><h3 style="margin-top:0;color:${esc(d.color || "")}">${esc(d.displayName || id)} ${id === myClass ? '<span class="pill good">อาชีพปัจจุบัน</span>' : ""}</h3>
    <div class="small muted">${esc(d.description || "")}</div>
    <div class="grid" style="margin-top:8px"><div class="kv">
      <b>สเตตัสหลัก</b><span>${esc((d.atkStat || "").toUpperCase())}</span>
      <b>ระยะตี</b><span>${d.attackRange}${d.projectile ? " (ยิงไกล)" : " (ประชิด)"}</span>
      <b>ตีทุก</b><span>${d.attackInterval}s</span><b>เดิน</b><span>${d.walkSpeed}</span>
      <b>แจกแต้ม auto</b><span>${(d.autoStats || []).map(a => a[0].toUpperCase() + "×" + a[1]).join(" · ")}</span></div>
      <div class="kv"><b>Lv ${lv}: HP</b><span>${num(s.hp)}</span><b>SP</b><span>${num(s.sp)}</span><b>ATK</b><span>${num(s.atk)}</span><b>DEF</b><span>${num(s.def)}</span><b>Crit</b><span>${num(s.crit * 100, 1)}%</span></div>
      <div class="kv small"><b>ฐาน</b><span>${Object.entries(d.base || {}).map(([k, v]) => k + " " + v).join(" · ")}</span>
      <b>ต่อเลเวล</b><span>${Object.entries(d.perLevel || {}).map(([k, v]) => k + " " + v).join(" · ")}</span>
      ${d.latePerLevel ? `<b>หลัง Lv${CL.lateFrom}</b><span>${Object.entries(d.latePerLevel).map(([k, v]) => k + " " + v).join(" · ")}</span>` : ""}</div></div>
    <h3>สกิล</h3><div class="tw"><table><thead><tr><th>สกิล</th><th>ชนิด</th><th class="num">ปลดที่ Lv</th><th class="num">SP</th><th class="num">คูลดาวน์</th><th class="num">ดาเมจ</th><th>รายละเอียด</th></tr></thead>
    <tbody>${(d.skills || []).map(skillRow).join("")}${(d.passives || []).map(skillRow).join("")}</tbody></table></div>

    <span class="muted small">ช่วงค่าโรล = ข้อความเดียวกับที่เกมใช้ (lineOdds) ที่เลเวลนั้น</span></div>
  ${table("opts", rows, [
    {h: "ออฟชั่น", k: r => statName(r.key), v: r => `<b>${esc(statName(r.key))}</b> <span class="muted small">${r.key}</span>`},
    {h: "ใช้กับ " + esc(cls), k: r => r.works ? 1 : 0, v: r => r.legacy ? '<span class="pill warn">legacy · ยังได้ผล</span>' : r.works ? '<span class="pill good">ได้ผล</span>' : '<span class="pill bad">ไม่มีผล</span>'},
    {h: "สายที่ใช้ได้", k: r => r.classes ? r.classes.join() : "", v: r => r.classes ? r.classes.map(c => `<span class="pill ${c === cls ? "good" : ""}">${esc(c)}</span>`).join("") : '<span class="muted">ทุกอาชีพ</span>'},
    {h: `ช่วงค่าที่ Lv ${lvKey}`, k: r => r.range || "", v: r => r.range ? esc(r.range) : (r.legacy ? '<span class="muted">ไม่สุ่มแล้ว</span>' : '<span class="muted">-</span>')},
    {h: "โอกาสได้ต่อบรรทัด", k: r => r.chance || 0, num: true, v: r => r.chance ? num(r.chance * 100, 2) + "%" : "-"},
    {h: "เพดานรวม", k: r => (EQ.rollCaps || {})[r.key] || 0, num: true, v: r => (EQ.rollCaps || {})[r.key] != null ? fmtStat(r.key, EQ.rollCaps[r.key]) : "-"},
  ])}
  <h3>Main (บรรทัดหลัก) ตามช่อง — Lv ${lvKey}</h3>
  <div class="grid">${mains.map(([t, keys]) => `<div class="card"><b>${esc(typeName(t))}</b> <span class="muted small">ค่าเริ่มต้น: ${esc(statName((EQ.mainDefault || {})[t]))}</span><div class="tw" style="margin-top:6px"><table><tbody>${keys.map(k => {
    const m = (R.mains[t] || {})[k] || {}; return `<tr><td>${esc(statName(k))}</td><td class="num">${esc(m.range || "-")}</td><td class="num">${m.chance ? num(m.chance * 100, 1) + "%" : "-"}</td></tr>`; }).join("")}</tbody></table></div></div>`).join("")}</div>

P.monsters = () => {
  const f = store.get("monF", {field: "", role: ""});
  const q = (state.q || "").toLowerCase();
  // field monsters only: dungeon / tower mobs (no respawn, set "dungeon") live on the dungeon page
  let rows = Object.values(MON.defs || {}).filter(m => !m.dungeon && !m.dungeonBoss && m.set !== "dungeon" && m.respawn != null)
    .filter(m => m.role !== "boss" || f.role === "boss");
  if (f.role) rows = rows.filter(m => m.role === f.role);
  if (f.field) rows = rows.filter(m => m.set === f.field);
  if (q) rows = rows.filter(m => (m.name || "").toLowerCase().includes(q) || m.id.includes(q));
  rows = rows.map(m => {
    const hit = hitOn(m), hits = Math.ceil(m.hp / Math.max(1, hit)), ttk = hits * calc.interval;
    const gold = ((m.gold || [0, 0])[0] + (m.gold || [0, 0])[1]) / 2 * (1 + calc.goldPct), exp = (m.exp || 0) * (1 + calc.expPct);
    const cyc = ttk + (calc.travel || 0);
    return {...m, _hit: hit, _hits: hits, _ttk: ttk, _gps: gold / cyc, _eps: exp / cyc, _gold: gold};
  });
  const inp = (k, label, step) => `<label>${label}<input data-calc="${k}" type="number" step="${step || "any"}" value="${calc[k]}"></label>`;
  return `<h2>มอนสเตอร์ & คำนวณดาเมจ <span class="muted small">${rows.length} ตัว · กดแถวดูของดรอป</span></h2>

P.formulas = () => {
  const lg = FO.levelGap || {};
  const pp = ST.perPoint || {}, ppm = ST.perPointMain || {};
  const ref = (EQ.refine || {});
  return `<h2>สูตร & ตีบวก</h2>
  <div class="card"><h3 style="margin-top:0">ดาเมจที่เราทำ (Formulas.damage)</h3>
  <div class="formula">ดาเมจ = ATK × ตัวคูณสกิล × สุ่ม(0.9 ~ 1.1)
ถ้าคริ (โอกาส = Crit Rate)  → × (${FO.critMultiplier ?? 1.5} + Crit Damage)
DEF ศัตรู หลังเจาะเกราะ = DEF × (1 − min(Armor Pierce, ${FO.armorPenCap ?? .5}))
มอนทั่วไป  → ดาเมจ − DEF × 0.5
มอนมี tier → ดาเมจ × ${FO.tierDefK ?? 6000} / (${FO.tierDefK ?? 6000} + DEF)
ขั้นต่ำ 1 เสมอ</div>
  <div class="formula" style="margin-top:6px">ส่วนต่างเลเวล = clamp(1 − (เลเวลมอน − เลเวลเรา) × ${lg.step}, ${lg.min}, ${lg.max})   → มอนเลเวลสูงกว่า 1 เลเวล ตีเบาลง ${num((lg.step || 0) * 100)}%</div></div>
  <div class="card"><h3 style="margin-top:0">ดาเมจที่เราโดน (Formulas.damageTaken)</h3>
  <div class="formula">โดน = ATK มอน × ตัวคูณ × สุ่ม(0.9 ~ 1.1) × ${FO.armorK ?? 1500} / (${FO.armorK ?? 1500} + DEF เรา) − DEF เรา × ${FO.armorFlat ?? .25}</div></div>
  <div class="card"><h3 style="margin-top:0">Power (เลขพลังรวม)</h3>
  <div class="formula">Power = ( ATK × (1/ความเร็วตี + ดาเมจสกิล × (1 + Skill%)) × (1 + Crit × ${(FO.critMultiplier ?? 1.5) - 1}) × (1 + Damage% + Boss% × ${(FO.powerWeights || {}).bossDmg})
        + DEF × ${(FO.powerWeights || {}).def} + HP × ${(FO.powerWeights || {}).hp} + SP × ${(FO.powerWeights || {}).sp}
        + เลเวลสกิล × ${(FO.powerWeights || {}).skillLevel} + การ์ด × ${(FO.powerWeights || {}).card} ) × ${FO.powerScale}</div></div>
  <div class="card"><h3 style="margin-top:0">แต้มสเตตัส</h3>
  <div class="small">เริ่ม ${ST.startPoints} แต้ม + ${ST.perLevel} แต้ม/เลเวล · ลงได้สูงสุด ${ST.max} ต่อสเตตัส · ATK/DEF/HP ที่โชว์ในเกม ×${ST.scale}</div>
  <div class="tw" style="margin-top:6px"><table><thead><tr><th>สเตตัส</th><th>1 แต้มให้ (ทุกอาชีพ)</th><th>ถ้าเป็นสเตตัสหลักของอาชีพ</th></tr></thead><tbody>
  ${(ST.list || []).map(s => `<tr><td><b>${s.toUpperCase()}</b> <span class="muted small">${esc(((ST.defs || {})[s] || {}).name || "")}</span></td><td>${bonusList(pp[s]) || '<span class="muted">-</span>'}</td><td>${bonusList(ppm[s])}</td></tr>`).join("")}</tbody></table></div>
  <div class="small muted" style="margin-top:6px">เพดาน: ${Object.entries(ST.caps || {}).map(([k, v]) => `${statName(k)} ${fmtStat(k, v)}`).join(" · ")} · ตีเร็วสุด ${ST.minAttackInterval}s/ครั้ง</div></div>
  <div class="card"><h3 style="margin-top:0">ตีบวก (Refine)</h3>
  <div class="small">ตีได้ถึง +${ref.max} · +1 ถึง +${ref.safe} ไม่มีพัง · หิน ${esc(nameOf(ref.stone))} · กันแตก ${esc(nameOf(ref.protect))} · Lucky Stone +${num((ref.luckyBonus || 0) * 100)}% · ของดันใช้ ${esc(nameOf((ref.dungeon || {}).stone))} / ${esc(nameOf((ref.dungeon || {}).protect))}</div>
  <div class="tw" style="margin-top:6px"><table><thead><tr><th>ตีเป็น</th><th class="num">โอกาสสำเร็จ</th></tr></thead><tbody>
  ${Array.from({length: ref.max || 10}, (_, i) => i + 1).map(n => `<tr><td>+${n}</td><td class="num">${ref.chance && ref.chance[n] != null ? num(ref.chance[n] * 100) + "%" : n <= ref.safe ? "100%" : "-"}</td></tr>`).join("")}</tbody></table></div>
  <div class="small muted" style="margin-top:6px">ค่าที่ได้ต่อ +1 ของแต่ละชิ้น ดูที่หน้า อุปกรณ์ (คอลัมน์ "ตีบวก +1")</div></div>
  <div class="card"><h3 style="margin-top:0">เลเวล</h3><div class="small">เลเวลสูงสุด ${(D.leveling || {}).maxLevel} · EXP ที่ต้องใช้ต่อเลเวล:</div>
  <div class="small mono" style="margin-top:6px">${((D.leveling || {}).expTable || []).map((x, i) => `Lv${i + 1}→${i + 2}: ${num(x)}`).filter((_, i) => i % 5 === 0 || i > 90).join(" · ")}</div></div>`;
};

// --------------------------------------------------------------- render
function render() {
  if (!P[state.page]) state.page = "home";
  $("#nav").innerHTML = PAGES.map(([id, t]) => `<a href="#${id}" class="${state.page === id ? "on" : ""}">${t}</a>`).join("");
  $("#ver").textContent = `เกมเวอร์ชัน ${D.meta.placeVersion} · ข้อมูล ${ago(D.meta.dumpedAt)}` + (ME ? ` · ตัวละคร ${ago(ME.at)}` : "");
  $("#main").innerHTML = P[state.page]();
  // filters / inputs
  document.querySelectorAll("[data-f]").forEach(el => el.onchange = () => { const [k, f] = el.dataset.f.split("."); const o = store.get(k, {}); o[f] = el.value; store.set(k, o); render(); });
  document.querySelectorAll("[data-calc]").forEach(el => el.onchange = () => { calc[el.dataset.calc] = parseFloat(el.value) || 0; store.set("calc", calc); render(); });
  const bind = (id, key, parse) => { const el = $("#" + id); if (el) el.onchange = () => { store.set(key, parse(el.value)); render(); }; };
  bind("clsLv", "clsLv", v => Math.max(1, Math.min(99, parseInt(v) || 1)));
  bind("optLv", "optLv", v => parseInt(v));
  bind("optCls", "optCls", v => v);
  const cr = $("#calcReset"); if (cr) cr.onclick = () => { calc = round4(calcDefault()); store.set("calc", calc); render(); };
}
// global search: jump to the page that has the best hit
$("#q").addEventListener("input", e => {
  state.q = e.target.value.trim();
  const q = state.q.toLowerCase();
  if (q.length >= 2 && !["gear", "monsters", "cards", "items"].includes(state.page)) {
    const hit = (pg, list) => list.some(x => (x.name || "").toLowerCase().includes(q)) ? pg : null;
    state.page = hit("monsters", Object.values(MON.defs || {}).filter(m => m.role !== "boss")) || hit("gear", Object.values(EQ.defs || {})) || hit("cards", Object.values(CARDS.defs || {})) || hit("items", Object.values(ITEMS)) || state.page;
    location.hash = state.page;
  }
  render();
  $("#q").focus();
});
$("#theme").onclick = () => { const cur = document.documentElement.dataset.theme; const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const next = cur ? (cur === "dark" ? "light" : "dark") : (dark ? "light" : "dark"); document.documentElement.dataset.theme = next; store.set("theme", next); };
{ const t = store.get("theme", null); if (t) document.documentElement.dataset.theme = t; }
render();
</script>
</body>
